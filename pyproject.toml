[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["app/static/vendor", "data", ".venv"]

[tool.ruff.lint]
# 安全集：E4/E7/E9 语法与风格、F 未定义/未使用、I import 排序、
# UP 现代注解、B 常见陷阱、RUF100 无用 noqa、少量可自动修复的便利规则。
select = [
    "E4", "E7", "E9", "F",
    "I", "UP", "B", "RUF100",
    "PIE810", "SIM103", "SIM118", "S110",
]
# B008：FastAPI Depends 作为默认参数是惯用法
# RUF012：SQLAlchemy Column 类是惯用法
# UP035：api_support 向后兼容导出 typing.Dict/List/Optional
ignore = ["B008", "RUF012", "UP035"]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许断言与 fixture 宽泛用法
"tests/*" = ["S110", "E402"]
